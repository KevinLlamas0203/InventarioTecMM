<head>

        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Archivo:wght@300;600;900&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-header-left: #0f172a;
            --bg-header-right: #1e293b;
            --text-main: #eff6ff;
            --text-muted: rgba(255, 255, 255, 0.72);
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.1);
            --tab-bg: rgba(255, 255, 255, 0.04);
            --tab-hover: rgba(255, 255, 255, 0.08);
            --active-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #ec4899 100%);
            --active-shadow: 0 10px 30px rgba(100, 100, 255, 0.35);
        }

        .tabs-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 1.5rem;
            padding: 1rem;
            display: flex;
            gap: 0.9rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            box-shadow: 0 30px 80px rgba(4, 9, 30, 0.25);
            backdrop-filter: blur(12px);
        }

        .tabs-panel button {
            flex: 1 1 14rem;
            min-width: 14rem;
            border: 1px solid transparent;
            background: var(--tab-bg);
            color: var(--text-main);
            padding: 1.05rem 1.2rem;
            border-radius: 1.5rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 0.95rem;
            text-align: left;
            outline: none;
        }

        .tabs-panel button svg {
            width: 1.8rem;
            height: 1.8rem;
            color: rgba(226, 232, 255, 0.8);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .tabs-panel .tab-label {
            display: grid;
            gap: 0.28rem;
        }

        .tabs-panel .tab-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fbff;
        }

        .tabs-panel .tab-subtitle {
            font-size: 0.88rem;
            color: rgba(226, 232, 255, 0.72);
            line-height: 1.4;
        }

        .tabs-panel button:hover {
            transform: translateY(-1px);
            background: var(--tab-hover);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .tabs-panel button.active {
            background: var(--active-gradient);
            color: #fff;
            box-shadow: var(--active-shadow);
            transform: translateY(-2px);
            border-color: transparent;
        }

        .tabs-panel button.active svg {
            color: #fff;
        }

        .tabs-panel button.active .tab-subtitle {
            color: rgba(255, 255, 255, 0.9);
        }

        .tab-content {
            min-height: 520px;
            border-radius: 1.5rem;
            background: rgba(15, 20, 38, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.75rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            animation: fadeContent 260ms ease;
            backdrop-filter: blur(10px);
        }

        .tab-content.loading::after {
            content: 'Cargando...';
            display: block;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.95rem;
            padding: 2rem 0;
        }

        @keyframes fadeContent {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* MODO CLARO - Pestañas formales */
        html[data-theme="light"] .tabs-panel {
            background: rgba(31, 58, 95, 0.05);
            border: 1px solid #D3D9E2;
            box-shadow: 0 4px 16px rgba(16, 24, 40, 0.08);
            backdrop-filter: blur(4px);
        }

        html[data-theme="light"] .tabs-panel button {
            background: #FFFFFF;
            color: #4B5563;
            border: 1px solid #D3D9E2;
        }

        html[data-theme="light"] .tabs-panel button svg {
            color: #8999A6;
        }

        html[data-theme="light"] .tabs-panel .tab-title {
            color: #1F3A5F;
            font-weight: 600;
        }

        html[data-theme="light"] .tabs-panel .tab-subtitle {
            color: #7C8CA0;
        }

        html[data-theme="light"] .tabs-panel button:hover {
            background: #EEF4FB;
            border-color: #1F3A5F;
            transform: translateY(-1px);
        }

        html[data-theme="light"] .tabs-panel button.active {
            background: linear-gradient(135deg, #1F3A5F 0%, #2B4B71 100%);
            color: #FFFFFF;
            box-shadow: 0 10px 24px rgba(31, 58, 95, 0.12);
            border-color: transparent;
        }

        html[data-theme="light"] .tabs-panel button.active svg {
            color: #FFFFFF;
        }

        html[data-theme="light"] .tabs-panel button.active .tab-title {
            color: #FFFFFF;
        }

        html[data-theme="light"] .tabs-panel button.active .tab-subtitle {
            color: rgba(255, 255, 255, 0.88);
        }

        html[data-theme="light"] .tab-content {
            background: #F8FAFC;
            border: 1px solid #E1E8ED;
            box-shadow: inset 0 0 0 1px rgba(16, 24, 40, 0.04);
            color: #111827;
        }

        html[data-theme="light"] .tab-content.loading::after {
            color: #4B5563;
        }

        .sidebar .nav-section .nav-item.active {
            background: linear-gradient(135deg, #3f57f2 0%, #8b4ff1 100%);
            color: #fff;
        }

        .sidebar .nav-section .nav-item.active svg,
        .sidebar .nav-section .nav-item.active .nav-badge {
            color: #fff;
        }

        .sidebar .nav-section .nav-item.active .nav-badge {
            background: #6b53f7;
        }

        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            .tabs-panel {
                justify-content: center;
            }
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.tab-button');
            const content = document.getElementById('tab-content');
            const fileMap = {
                catalogo: 'activos.html',
                movimientos: 'movimientos.html',
                resguardos: 'asignaciones.html'
            };

            function setActiveTab(selectedButton) {
                buttons.forEach(button => {
                    const isActive = button === selectedButton;
                    button.classList.toggle('active', isActive);
                    button.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });
            }

            async function loadTab(tabName) {
                content.classList.add('loading');
                content.innerHTML = '';
                document.querySelectorAll('[data-injected-modal="true"]').forEach(modal => modal.remove());
                // Limpiar clases de secciones previas
                content.classList.remove('activos-page', 'movimientos-page', 'asignaciones-page');
                content.removeAttribute('data-activos-initialized');
                content.removeAttribute('data-movimientos-initialized');
                content.removeAttribute('data-asignaciones-initialized');
                content.removeAttribute('data-asset-filters-bound');
                content.removeAttribute('data-movement-filters-bound');
                content.removeAttribute('data-assignment-filters-bound');
                try {
                    const response = await fetch(fileMap[tabName]);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');

                    const mainContent = doc.querySelector('.main-content') || doc.querySelector('main');
                    const modals = Array.from(doc.querySelectorAll('.modal'));
                    const contentClone = mainContent ? mainContent.cloneNode(true) : doc.body.cloneNode(true);
                    contentClone.querySelectorAll('.modal').forEach(modal => modal.remove());
                    const fragmentHtml = contentClone.innerHTML;

                    // Agregar clase específica según la sección
                    const classMap = {
                        catalogo: 'activos-page',
                        movimientos: 'movimientos-page',
                        resguardos: 'asignaciones-page'
                    };

                    if (classMap[tabName]) {
                        content.classList.add(classMap[tabName]);
                    }

                    content.classList.remove('loading');
                    content.innerHTML = fragmentHtml;
                    modals.forEach(modal => {
                        if (modal.id) {
                            document.getElementById(modal.id)?.remove();
                        }
                        const modalClone = modal.cloneNode(true);
                        modalClone.dataset.injectedModal = 'true';
                        document.body.appendChild(modalClone);
                    });

                    // Cargar estilos específicos de la página inyectada (si los tiene)
                    const linkTags = Array.from(doc.querySelectorAll('link[rel="stylesheet"]'));
                    linkTags.forEach(link => {
                        const href = link.href ? new URL(link.href, response.url).href : null;
                        if (!href) return;
                        if (!document.querySelector(`link[rel="stylesheet"][href="${href}"]`)) {
                            const newLink = document.createElement('link');
                            newLink.rel = 'stylesheet';
                            newLink.href = href;
                            document.head.appendChild(newLink);
                        }
                    });

                    // Re-ejecutar scripts inline y externos del documento cargado en orden
                    const scripts = Array.from(doc.querySelectorAll('script'));
                    console.log(`Loading ${scripts.length} script(s) from ${tabName}`);
                    const loadPromises = scripts.map(script => {
                        const src = script.src ? new URL(script.src, response.url).href : null;
                        if (src && src.endsWith('/js/app.js')) {
                            return Promise.resolve();
                        }
                        if (src) {
                            const loadedScript = document.querySelector(`script[data-dynamic-src="${src}"]`);
                            if (loadedScript) {
                                return Promise.resolve();
                            }
                        }

                        return new Promise((resolve) => {
                            const newScript = document.createElement('script');
                            if (script.type) newScript.type = script.type;

                            if (src) {
                                newScript.src = src;
                                newScript.dataset.dynamicSrc = src;
                                newScript.async = false;
                                newScript.onload = resolve;
                                newScript.onerror = () => {
                                    console.error('Error cargando script:', src);
                                    resolve();
                                };
                                document.body.appendChild(newScript);
                            } else {
                                newScript.textContent = script.textContent;
                                document.body.appendChild(newScript);
                                resolve();
                            }
                        });
                    });

                    await Promise.all(loadPromises);

                    if (tabName === 'movimientos') {
                        if (typeof initMovimientosPage === 'function') {
                            initMovimientosPage();
                        } else {
                            console.warn('initMovimientosPage no está definido tras cargar movimientos.js');
                            await loadPageScript('../js/movimientos.js');
                            if (typeof initMovimientosPage === 'function') {
                                initMovimientosPage();
                            }
                        }
                    }

                    if (typeof initApp === 'function') {
                        initApp();
                    }

                    if (tabName === 'catalogo' && typeof initActivosPage === 'function') {
                        initActivosPage();
                    }

                    if (tabName === 'resguardos' && typeof initAsignacionesPage === 'function') {
                        initAsignacionesPage();
                    }
                } catch (error) {
                    content.classList.remove('loading');
                    content.innerHTML = `<div style="padding:2rem;text-align:center;color:rgba(255,255,255,0.8);">No se pudo cargar la sección. Intenta de nuevo más tarde.</div>`;
                    console.error('Error cargando contenido:', error);
                }
            }

            async function loadPageScript(src) {
                return new Promise((resolve) => {
                    const absoluteSrc = new URL(src, window.location.href).href;
                    const loadedScript = document.querySelector(`script[data-dynamic-src="${absoluteSrc}"]`);
                    if (loadedScript) {
                        resolve();
                        return;
                    }
                    const script = document.createElement('script');
                    script.src = absoluteSrc;
                    script.dataset.dynamicSrc = absoluteSrc;
                    script.async = false;
                    script.onload = resolve;
                    script.onerror = () => {
                        console.error('Error cargando script adicional:', src);
                        resolve();
                    };
                    document.body.appendChild(script);
                });
            }

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const tabName = button.dataset.tab;
                    setActiveTab(button);
                    loadTab(tabName);
                });
            });

            const defaultButton = document.querySelector('.tab-button.active');
            if (defaultButton) {
                loadTab(defaultButton.dataset.tab);
            }
        });
    </script>
