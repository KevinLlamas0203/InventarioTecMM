<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Sistema de Inventario</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Archivo:wght@300;600;900&display=swap" rel="stylesheet">
    <style>
        .module-header {
            background: linear-gradient(135deg, #2f3eb8 0%, #6b53f7 100%);
            padding: 2rem 2rem 1.5rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 50px rgba(23, 27, 60, 0.3);
            margin-bottom: 1.5rem;
            color: #fff;
        }

        .module-header h1 {
            font-family: 'Archivo', sans-serif;
            font-size: clamp(2rem, 2.75vw, 2.8rem);
            margin: 0 0 0.5rem;
            letter-spacing: -0.02em;
        }

        .module-header p {
            margin: 0;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1rem;
        }

        .tabs-panel {
            background: rgba(15, 15, 15, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 1.25rem;
            padding: 0.75rem;
            display: flex;
            gap: 0.75rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
        }

        .tabs-panel button {
            flex: 1 1 11rem;
            min-width: 10rem;
            border: none;
            background: rgba(255, 255, 255, 0.04);
            color: rgba(255, 255, 255, 0.85);
            padding: 1rem 1.2rem;
            border-radius: 1rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.975rem;
            transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.65rem;
        }

        .tabs-panel button:hover {
            transform: translateY(-1px);
            background: rgba(255,255,255,0.08);
        }

        .tabs-panel button.active {
            background: linear-gradient(135deg, #3f57f2 0%, #8b4ff1 100%);
            box-shadow: 0 14px 32px rgba(63, 87, 242, 0.24);
            color: #fff;
        }

        .tabs-panel button.active svg {
            color: #fff;
        }

        .tab-content {
            min-height: 520px;
            border-radius: 1.5rem;
            background: rgba(18, 20, 34, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.5rem;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
            animation: fadeContent 260ms ease;
        }

        .tab-content.loading::after {
            content: 'Cargando...';
            display: block;
            text-align: center;
            color: rgba(255,255,255,0.65);
            font-size: 0.95rem;
            padding: 2rem 0;
        }

        @keyframes fadeContent {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .sidebar .nav-section .nav-item.active {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }

        .sidebar .nav-section .nav-item.active .nav-badge {
            background: #6b53f7;
            color: #fff;
        }

        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            .tabs-panel {
                justify-content: center;
            }
        }
    </style>
</head>
<body class="dashboard-page">
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-brand">
                    <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <rect x="5" y="5" width="30" height="30" rx="6" fill="currentColor" opacity="0.2"/>
                        <path d="M13 16h14M13 20h14M13 24h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                        <circle cx="28" cy="24" r="2" fill="currentColor"/>
                    </svg>
                    <span class="brand-name">Sistema de Inventario</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <div class="nav-section">
                    <span class="nav-section-title">Principal</span>
                    <a href="dashboard_admin.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="3" y="3" width="7" height="7" stroke-width="2" rx="1"/>
                            <rect x="14" y="3" width="7" height="7" stroke-width="2" rx="1"/>
                            <rect x="14" y="14" width="7" height="7" stroke-width="2" rx="1"/>
                            <rect x="3" y="14" width="7" height="7" stroke-width="2" rx="1"/>
                        </svg>
                        <span>Dashboard</span>
                    </a>
                </div>
                <div class="nav-section">
                    <span class="nav-section-title">Gestión</span>
                    <a href="moduloActivo.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <rect x="2" y="3" width="20" height="14" rx="2" stroke-width="2"/>
                            <path d="M8 21h8M12 17v4" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                        <span>Módulo de Activos</span>
                        <span class="nav-badge">245</span>
                    </a>
                    <a href="consumibles.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" stroke-width="2"/>
                            <polyline points="3.27 6.96 12 12.01 20.73 6.96" stroke-width="2"/>
                            <line x1="12" y1="22.08" x2="12" y2="12" stroke-width="2"/>
                        </svg>
                        <span>Consumibles</span>
                    </a>
                </div>
                <div class="nav-section">
                    <span class="nav-section-title">Sistema</span>
                    <a href="usuarios.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" stroke-width="2"/>
                            <circle cx="9" cy="7" r="4" stroke-width="2"/>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-width="2"/>
                        </svg>
                        <span>Usuarios</span>
                    </a>
                    <a href="reportes.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-width="2"/>
                            <polyline points="14 2 14 8 20 8" stroke-width="2"/>
                            <line x1="16" y1="13" x2="8" y2="13" stroke-width="2"/>
                            <line x1="16" y1="17" x2="8" y2="17" stroke-width="2"/>
                        </svg>
                        <span>Reportes</span>
                    </a>
                    <a href="ajustes.html" class="nav-item">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                        <span>Ajustes</span>
                    </a>
                </div>
            </nav>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <h1 class="page-title">Dashboard</h1>
                    <p class="page-subtitle">Resumen general del inventario ISC</p>
                </div>
            </header>

            <section class="tabs-panel" role="tablist" aria-label="Secciones del módulo de activos">
                <button class="tab-button active" data-tab="catalogo" type="button" aria-selected="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" stroke-width="2"/>
                        <polyline points="14 2 14 8 20 8" stroke-width="2"/>
                    </svg>
                    Catálogo
                </button>
                <button class="tab-button" data-tab="movimientos" type="button" aria-selected="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" stroke-width="2"/>
                        <polyline points="7 10 12 15 17 10" stroke-width="2"/>
                        <line x1="12" y1="15" x2="12" y2="3" stroke-width="2"/>
                    </svg>
                    Movimientos
                </button>
                <button class="tab-button" data-tab="resguardos" type="button" aria-selected="false">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" width="18" height="18">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" stroke-width="2"/>
                        <circle cx="9" cy="7" r="4" stroke-width="2"/>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75" stroke-width="2"/>
                    </svg>
                    Resguardos
                </button>
            </section>

            <div id="tab-content" class="tab-content" aria-live="polite"></div>
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const buttons = document.querySelectorAll('.tab-button');
            const content = document.getElementById('tab-content');
            const fileMap = {
                catalogo: 'activos.html',
                movimientos: 'movimientos.html',
                resguardos: 'asignaciones.html'
            };

            function setActiveTab(selectedButton) {
                buttons.forEach(button => {
                    const isActive = button === selectedButton;
                    button.classList.toggle('active', isActive);
                    button.setAttribute('aria-selected', isActive ? 'true' : 'false');
                });
            }

            async function loadTab(tabName) {
                content.classList.add('loading');
                content.innerHTML = '';
                try {
                    const response = await fetch(fileMap[tabName]);
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    const html = await response.text();
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(html, 'text/html');
                    const mainContent = doc.querySelector('.main-content') || doc.querySelector('main');
                    const fragmentHtml = mainContent ? mainContent.innerHTML : doc.body.innerHTML;
                    content.classList.remove('loading');
                    content.innerHTML = fragmentHtml;
                } catch (error) {
                    content.classList.remove('loading');
                    content.innerHTML = `<div style="padding:2rem;text-align:center;color:rgba(255,255,255,0.8);">No se pudo cargar la sección. Intenta de nuevo más tarde.</div>`;
                    console.error('Error cargando contenido:', error);
                }
            }

            buttons.forEach(button => {
                button.addEventListener('click', () => {
                    const tabName = button.dataset.tab;
                    setActiveTab(button);
                    loadTab(tabName);
                });
            });

            const defaultButton = document.querySelector('.tab-button.active');
            if (defaultButton) {
                loadTab(defaultButton.dataset.tab);
            }
        });
    </script>
</body>
</html>
