<!DOCTYPE html>
<html>
<head>
    <title>Test Préstamo DELETE</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .section { margin: 20px 0; padding: 10px; border: 1px solid #ddd; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Pruebas de Préstamos</h1>
    
    <div class="section">
        <h2>1. Crear Préstamo (POST)</h2>
        <button onclick="testCreate()">Crear</button>
        <pre id="createResult"></pre>
    </div>

    <div class="section">
        <h2>2. Listar Préstamos (GET)</h2>
        <button onclick="testList()">Listar</button>
        <pre id="listResult"></pre>
    </div>

    <div class="section">
        <h2>3. Eliminar Préstamo (DELETE)</h2>
        <p>ID: <input type="number" id="deleteId" value="1" placeholder="ID del préstamo"></p>
        <button onclick="testDelete()">Eliminar</button>
        <pre id="deleteResult"></pre>
    </div>

    <script>
        const API = 'http://localhost:5000';

        async function testCreate() {
            const payload = {
                solicitante: "Test User " + Date.now(),
                alumnos: 2,
                docente: "Prof Test",
                lab: "Lab Test",
                inicio: "2026-05-22T09:00",
                fin: "2026-05-22T11:00",
                items: [{ tipo: "Activo", nombre: "Computadora", cantidad: 1 }],
                notas: "Prueba"
            };

            try {
                const res = await fetch(`${API}/prestamos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                document.getElementById('createResult').textContent = `Status: ${res.status}\n${JSON.stringify(data, null, 2)}`;
            } catch (e) {
                document.getElementById('createResult').textContent = 'Error: ' + e.message;
            }
        }

        async function testList() {
            try {
                const res = await fetch(`${API}/prestamos`);
                const data = await res.json();
                document.getElementById('listResult').textContent = `Status: ${res.status}\n${JSON.stringify(data, null, 2)}`;
            } catch (e) {
                document.getElementById('listResult').textContent = 'Error: ' + e.message;
            }
        }

        async function testDelete() {
            const id = document.getElementById('deleteId').value;
            try {
                const res = await fetch(`${API}/prestamos/${id}`, { method: 'DELETE' });
                const data = await res.json();
                document.getElementById('deleteResult').textContent = `Status: ${res.status}\n${JSON.stringify(data, null, 2)}`;
            } catch (e) {
                document.getElementById('deleteResult').textContent = 'Error: ' + e.message;
            }
        }
    </script>
</body>
</html>
