<!DOCTYPE html>
<html>
<head>
    <title>Test Préstamo</title>
</head>
<body>
    <h1>Prueba de Préstamo</h1>
    <button onclick="testPrestamo()">Crear Préstamo</button>
    <pre id="resultado"></pre>

    <script>
        async function testPrestamo() {
            const payload = {
                solicitante: "Test User",
                alumnos: 2,
                docente: "Prof Test",
                lab: "Lab Test",
                inicio: "2026-05-22T09:00",
                fin: "2026-05-22T11:00",
                items: [
                    { tipo: "Activo", nombre: "Computadora", cantidad: 1 }
                ],
                notas: "Prueba"
            };

            console.log("Enviando payload:", payload);
            document.getElementById('resultado').textContent = "Enviando...";

            try {
                const res = await fetch('http://localhost:5000/prestamos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                console.log("Status:", res.status);
                const data = await res.json();
                console.log("Response:", data);
                document.getElementById('resultado').textContent = JSON.stringify(data, null, 2);
            } catch (e) {
                console.error("Error:", e);
                document.getElementById('resultado').textContent = "Error: " + e.message;
            }
        }
    </script>
</body>
</html>
