        <style>
        :root {
            --bg-header-left: #0f172a;
            --bg-header-right: #1e293b;
            --text-main: #eff6ff;
            --text-muted: rgba(255, 255, 255, 0.72);
            --panel-bg: rgba(255, 255, 255, 0.05);
            --panel-border: rgba(255, 255, 255, 0.1);
            --tab-bg: rgba(255, 255, 255, 0.04);
            --tab-hover: rgba(255, 255, 255, 0.08);
            --active-gradient: linear-gradient(135deg, #4f46e5 0%, #7c3aed 55%, #ec4899 100%);
            --active-shadow: 0 10px 30px rgba(100, 100, 255, 0.35);
        }

        .tabs-panel {
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 1.5rem;
            padding: 1rem;
            display: flex;
            gap: 0.9rem;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            box-shadow: 0 30px 80px rgba(4, 9, 30, 0.25);
            backdrop-filter: blur(12px);
        }

        .tabs-panel button {
            flex: 1 1 14rem;
            min-width: 14rem;
            border: 1px solid transparent;
            background: var(--tab-bg);
            color: var(--text-main);
            padding: 1.05rem 1.2rem;
            border-radius: 1.5rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.95rem;
            transition: transform 220ms ease, background 220ms ease, box-shadow 220ms ease, border-color 220ms ease;
            display: flex;
            align-items: flex-start;
            justify-content: flex-start;
            gap: 0.95rem;
            text-align: left;
            outline: none;
        }

        .tabs-panel button svg {
            width: 1.8rem;
            height: 1.8rem;
            color: rgba(226, 232, 255, 0.8);
            flex-shrink: 0;
            margin-top: 2px;
        }

        .tabs-panel .tab-label {
            display: grid;
            gap: 0.28rem;
        }

        .tabs-panel .tab-title {
            font-size: 1rem;
            font-weight: 600;
            color: #f8fbff;
        }

        .tabs-panel .tab-subtitle {
            font-size: 0.88rem;
            color: rgba(226, 232, 255, 0.72);
            line-height: 1.4;
        }

        .tabs-panel button:hover {
            transform: translateY(-1px);
            background: var(--tab-hover);
            border-color: rgba(255, 255, 255, 0.16);
        }

        .tabs-panel button.active {
            background: var(--active-gradient);
            color: #fff;
            box-shadow: var(--active-shadow);
            transform: translateY(-2px);
            border-color: transparent;
        }

        .tabs-panel button.active svg {
            color: #fff;
        }

        .tabs-panel button.active .tab-subtitle {
            color: rgba(255, 255, 255, 0.9);
        }

        .tab-content {
            min-height: 520px;
            border-radius: 1.5rem;
            background: rgba(15, 20, 38, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 1.75rem;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
            animation: fadeContent 260ms ease;
            backdrop-filter: blur(10px);
        }

        .tab-content.loading::after {
            content: 'Cargando...';
            display: block;
            text-align: center;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.95rem;
            padding: 2rem 0;
        }

        @keyframes fadeContent {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .sidebar .nav-section .nav-item.active {
            background: linear-gradient(135deg, #3f57f2 0%, #8b4ff1 100%);
            color: #fff;
        }

        .sidebar .nav-section .nav-item.active svg,
        .sidebar .nav-section .nav-item.active .nav-badge {
            color: #fff;
        }

        .sidebar .nav-section .nav-item.active .nav-badge {
            background: #6b53f7;
        }

        @media (max-width: 900px) {
            .dashboard-layout {
                grid-template-columns: 1fr;
            }

            .tabs-panel {
                justify-content: center;
            }
        }
    </style>
</head>
